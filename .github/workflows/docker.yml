name: Docker image

on: push

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Build NAS image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: taggz:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Test the built image
        run: |
          docker run --rm --network none --workdir /tmp \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/tests,dst=/tests,readonly" \
            --entrypoint python taggz:ci -m unittest discover -s /tests -v

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "sha-${GITHUB_SHA:0:12}" latest; do
            docker tag taggz:ci "$image:$tag"
            docker push "$image:$tag"
          done
