[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taggz"
version = "0.1.0"
description = "Evidence-based FLAC tagging and staging for a NAS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mutagen==1.47.0"]

[project.scripts]
taggz = "taggz.cli:main"
taggz-docker = "taggz.docker:main"

[tool.setuptools.packages.find]
include = ["taggz*"]
